<title>TMWRC</title>
<meta name="theme-color" content="#F5F5F7">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<style>
  /* App shell: header, scrolling views, bottom tab bar. SOS red is the only loud colour. */
  :root { --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1); --nav-h: 64px; }
  html, body { height: 100%; }
  body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100%; position: relative; }
  .hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand-bg); color: var(--on-brand);
         padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .logo { font-family: var(--font-display); font-weight: 900; font-stretch: 125%; font-size: 1.5rem; letter-spacing: .08em; line-height: 1; }
  .hdr .grow { flex: 1; }
  .netdot { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.12); }
  .netdot i { width: 8px; height: 8px; border-radius: 50%; background: #6EE7A6; box-shadow: 0 0 0 0 rgba(110,231,166,.7); animation: beat 2s infinite; }
  .netdot.off i { background: #FF8A7A; animation: none; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(110,231,166,.6); } 70% { box-shadow: 0 0 0 7px rgba(110,231,166,0); } 100% { box-shadow: 0 0 0 0 rgba(110,231,166,0); } }

  .offbar { background: var(--warn); color: #fff; font-size: .85rem; font-weight: 600; padding: 8px 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between;
            animation: drop .35s var(--ease); }
  .offbar button { background: #fff; color: var(--warn); border: 0; border-radius: 8px; padding: 5px 10px; font-weight: 800; cursor: pointer; }
  @keyframes drop { from { transform: translateY(-100%); opacity: 0; } }

  main.view { padding-inline: 16px; padding-block: 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; animation: viewIn .38s var(--ease); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
  .hello { display: grid; gap: 2px; }
  .hello h1 { font-size: 1.6rem; font-weight: 900; font-stretch: 112%; }

  /* SOS */
  .sos-zone { display: grid; justify-items: center; gap: 12px; padding-block: 8px 4px; }
  .sos { position: relative; width: 184px; height: 184px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
         background: radial-gradient(circle at 50% 35%, var(--sos), var(--sos-deep)); box-shadow: 0 14px 34px -8px color-mix(in srgb, var(--sos) 60%, transparent);
         display: grid; place-items: center; transition: transform .18s var(--ease); isolation: isolate; }
  .sos::before, .sos::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--sos); z-index: -1; animation: ring 2.4s var(--ease) infinite; }
  .sos::after { animation-delay: 1.2s; }
  @keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.55); opacity: 0; } }
  .sos:active { transform: scale(.94); }
  .sos b { font-family: var(--font-display); font-weight: 900; font-stretch: 125%; font-size: 3rem; letter-spacing: .08em; line-height: 1; }
  .sos small { display: block; font-size: .72rem; font-weight: 700; opacity: .9; margin-top: 4px; letter-spacing: .04em; }
  .sos-cap { font-size: .85rem; color: var(--muted); text-align: center; max-width: 34ch; }

  /* status strip */
  .strip { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }
  .loc-chip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; min-width: 0; text-align: left; cursor: pointer; }
  .loc-chip svg { flex: none; color: var(--brand); }
  .loc-chip .t { min-width: 0; display: grid; }
  .loc-chip .t b { font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loc-chip .t span { font-size: .75rem; color: var(--muted); }
  .safe-btn { border: 0; border-radius: 14px; background: var(--ok); color: #fff; font-weight: 800; padding: 0 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform .15s var(--ease); }
  .safe-btn:active { transform: scale(.95); }

  /* quick report tiles */
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; }
  .sec-h h2 { font-size: 1.1rem; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 380px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 6px 10px; display: grid; justify-items: center; gap: 6px; cursor: pointer;
          font-size: .74rem; font-weight: 700; line-height: 1.2; text-align: center; transition: transform .18s var(--spring), border-color .2s;
          animation: pop .45s var(--spring) both; animation-delay: calc(var(--i) * 40ms); }
  .tile:hover { border-color: var(--brand); }
  .tile:active { transform: scale(.92); }
  .tile .ic { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); color: var(--brand); display: grid; place-items: center; }
  @keyframes pop { from { opacity: 0; transform: scale(.85) translateY(8px); } }

  /* activity */
  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .feed li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center;
             animation: pop .4s var(--ease) both; animation-delay: calc(var(--i) * 35ms); }
  .feed .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--brand); grid-row: span 2; }
  .feed .ic.sos { background: color-mix(in srgb, var(--sos) 14%, transparent); color: var(--sos); }
  .feed .ic.checkin { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .feed b { font-size: .92rem; }
  .feed .meta { font-size: .76rem; color: var(--muted); font-family: var(--font-mono); grid-column: 2; }
  .badge { font-size: .7rem; font-weight: 800; border-radius: 999px; padding: 3px 9px; grid-row: span 2; white-space: nowrap; }
  .badge.sent { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .badge.queued { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .empty-state { text-align: center; color: var(--muted); padding: 32px 16px; display: grid; justify-items: center; gap: 8px; }

  /* SMS view */
  .numrow { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px; border-radius: 12px; background: var(--surface-2); }
  .numrow b { font-family: var(--font-mono); }
  #smsText { font-family: var(--font-mono); font-size: .8rem; min-height: 130px; }

  /* bottom nav */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
         border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); position: relative; }
  .nav button { background: none; border: 0; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: .7rem; font-weight: 700; color: var(--muted); cursor: pointer; position: relative; }
  .nav button svg { transition: transform .25s var(--spring); }
  .nav button[aria-current="page"] { color: var(--brand); }
  .nav button[aria-current="page"] svg { transform: translateY(-2px) scale(1.12); }
  .nav .ind { position: absolute; top: 0; height: 3px; width: 25%; background: var(--brand); border-radius: 0 0 3px 3px; transition: transform .35s var(--ease); }
  .nav .count { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--warn); color: #fff; font-size: .62rem; border-radius: 999px; padding: 1px 5px; }

  /* bottom sheet */
  .scrim { position: fixed; inset: 0; background: rgba(6,12,28,.5); z-index: 40; animation: fade .25s var(--ease); }
  @keyframes fade { from { opacity: 0; } }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0;
           padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: up .38s var(--ease); max-height: 90%; overflow: auto; }
  .sheet.closing { animation: down .25s var(--ease) forwards; } .scrim.closing { animation: fadeout .25s forwards; }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes down { to { transform: translateY(100%); } }
  @keyframes fadeout { to { opacity: 0; } }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
  .sheet-h { display: flex; gap: 12px; align-items: center; }
  .sheet-h .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-2); color: var(--brand); display: grid; place-items: center; flex: none; }
  .sheet-h h2 { font-size: 1.25rem; }
  .attach { display: flex; gap: 8px; align-items: center; font-size: .82rem; color: var(--muted); }
  .attach svg { color: var(--ok); flex: none; }
  .big { padding: 15px 16px; font-size: 1.02rem; border-radius: 14px; }

  /* success */
  .done { display: grid; justify-items: center; gap: 10px; text-align: center; padding-block: 18px 6px; }
  .done svg circle { stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw .55s var(--ease) forwards; }
  .done svg path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .35s .45s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .done h2 { font-size: 1.35rem; }

  /* SOS countdown overlay */
  .cd { position: fixed; inset: 0; z-index: 50; background: radial-gradient(circle at 50% 40%, var(--sos), var(--sos-deep) 70%); color: #fff;
        display: grid; place-items: center; padding: 24px 16px; text-align: center; animation: fade .2s; }
  .cd .in { display: grid; gap: 22px; justify-items: center; max-width: 380px; }
  .ringwrap { position: relative; width: 190px; height: 190px; display: grid; place-items: center; }
  .ringwrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ringwrap .prog { stroke-dasharray: 565; stroke-dashoffset: 0; animation: deplete 3s linear forwards; }
  @keyframes deplete { to { stroke-dashoffset: 565; } }
  .ringwrap .n { font-family: var(--font-display); font-size: 5.4rem; font-weight: 900; font-variant-numeric: tabular-nums; animation: tick 1s var(--ease) infinite; }
  @keyframes tick { 0% { transform: scale(1.15); } 30% { transform: scale(1); } }
  .cd .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .cd .btn { padding: 14px; border-radius: 14px; font-size: 1rem; }
  .cd .ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.6); }
  .cd .white { background: #fff; color: var(--sos-deep); border: 0; }

  /* onboarding */
  .onb { padding-inline: 16px; padding-block: 18px 40px; display: grid; gap: 18px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .steps i { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; }
  .steps i::after { content: ""; position: absolute; inset: 0; background: var(--brand); transform: scaleX(0); transform-origin: left; transition: transform .45s var(--ease); }
  .steps i.on::after { transform: scaleX(1); }
  .step { display: grid; gap: 14px; animation: slideIn .4s var(--ease); }
  .step.back { animation: slideBack .4s var(--ease); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(28px); } }
  @keyframes slideBack { from { opacity: 0; transform: translateX(-28px); } }
  .step h1 { font-size: 1.55rem; font-weight: 900; font-stretch: 110%; }
  .onb-nav { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
  .welcome { display: grid; gap: 6px; }
  .welcome .logo { color: var(--brand); font-size: 2.6rem; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .centre-msg { background: var(--brand-bg); color: #fff; border-radius: 18px; padding: 14px 16px; display: grid; gap: 6px; text-align: left; border: 0; cursor: pointer; animation: pop .5s var(--spring); position: relative; }
  .centre-msg .eyebrow { color: rgba(255,255,255,.75); display: flex; gap: 6px; align-items: center; }
  .centre-msg .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: #FFD166; animation: beat 1.6s infinite; }
  .centre-msg p { font-size: 1rem; font-weight: 600; }
  .centre-msg span.r { font-size: .8rem; font-weight: 800; text-decoration: underline; }
  .feed li.tap { cursor: pointer; }
  .badge.new { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }
  .badge.in_progress { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .badge.resolved { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .feed .msgdot { grid-column: 2 / -1; font-size: .76rem; font-weight: 800; color: var(--brand); }
  .thread { display: grid; gap: 8px; max-height: 46vh; overflow: auto; padding: 2px; }
  .bub { max-width: 84%; padding: 9px 12px; border-radius: 16px; font-size: .92rem; animation: pop .35s var(--spring); overflow-wrap: anywhere; }
  .bub small { display: block; font-size: .68rem; opacity: .75; margin-top: 3px; }
  .bub.staff { background: var(--surface-2); justify-self: start; border-bottom-left-radius: 5px; }
  .bub.worker { background: var(--brand-bg); color: #fff; justify-self: end; border-bottom-right-radius: 5px; }
  .composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  .composer textarea { min-height: 46px; }
  .sendc { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--brand-bg); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .lang { display: inline-flex; border-radius: 999px; background: rgba(255,255,255,.12); padding: 2px; }
  .lang button { border: 0; background: transparent; color: #fff; font-weight: 800; font-size: .75rem; padding: 4px 9px; border-radius: 999px; cursor: pointer; transition: background .2s; }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--brand-bg); }
  .toast { animation: toastIn .3s var(--spring); }
  @keyframes toastIn { from { transform: translate(-50%, 20px); opacity: 0; } }
  .toast { bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); }
  /* ---- Apple-style finish ---- */
  .hdr { background: var(--navbg); color: var(--ink); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
  .logo { font-family: var(--font-display); font-weight: 700; font-stretch: normal; letter-spacing: -.03em; font-size: 1.4rem; color: var(--ink); }
  .nav { background: var(--navbg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); }
  .nav .ind { display: none; }
  .nav button { font-weight: 500; font-size: .68rem; letter-spacing: 0; }
  .nav button[aria-current="page"] { color: var(--brand-bg); }
  .nav .count { background: var(--sos); font-weight: 600; }
  .netdot { background: var(--surface-2); color: var(--ink); font-weight: 500; }
  .netdot i { background: var(--ok-fill); }
  .lang { background: var(--surface-2); padding: 2px; }
  .lang button { color: var(--ink); font-weight: 600; }
  .lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .offbar { background: var(--surface); color: var(--warn); border-bottom: .5px solid var(--line); }
  .offbar button { background: var(--brand-bg); color: #fff; border-radius: 980px; padding: 6px 14px; font-weight: 500; }
  main.view { gap: 22px; }
  .hello { gap: 0; }
  .hello h1 { font-size: 2.15rem; font-weight: 700; font-stretch: normal; letter-spacing: -.03em; }
  .hello .eyebrow { font-size: .95rem; }
  .sos { width: 196px; height: 196px; background: linear-gradient(180deg, #FF6259 0%, var(--sos) 45%, var(--sos-deep) 100%); box-shadow: 0 20px 40px -12px color-mix(in srgb, var(--sos) 55%, transparent); }
  .sos::before, .sos::after { border-width: 1.5px; }
  .sos b { font-family: var(--font-display); font-weight: 700; font-stretch: normal; letter-spacing: -.01em; font-size: 3.2rem; }
  .sos small { font-weight: 500; letter-spacing: .02em; font-size: .72rem; }
  .sos-cap { font-size: .92rem; }
  .loc-chip { border: 0; border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; }
  .loc-chip svg { color: var(--brand-bg); }
  .loc-chip .t b { font-weight: 600; }
  .safe-btn { border-radius: 980px; background: var(--ok-fill); color: #fff; font-weight: 600; padding: 0 20px; }
  .sec-h h2 { font-size: 1.45rem; font-weight: 700; }
  .tiles { gap: 12px; }
  .tile { border: 0; border-radius: 20px; box-shadow: var(--shadow); font-weight: 500; font-size: .74rem; padding: 14px 6px 12px; letter-spacing: -.01em; }
  .tile .ic { border-radius: 50%; background: color-mix(in srgb, var(--brand-bg) 10%, transparent); color: var(--brand-bg); }
  .feed li { border: 0; border-radius: 18px; box-shadow: var(--shadow); }
  .feed .ic { border-radius: 50%; color: var(--brand-bg); background: color-mix(in srgb, var(--brand-bg) 10%, transparent); }
  .feed b { font-weight: 600; }
  .feed .meta { font-size: .74rem; }
  .badge { font-weight: 600; }
  .badge.new { color: var(--brand); background: color-mix(in srgb, var(--brand-bg) 12%, transparent); }
  .numrow { border-radius: 14px; background: var(--bg); }
  .sheet { border-radius: 14px 14px 0 0; background: var(--surface); }
  .sheet-h .ic { border-radius: 50%; color: var(--brand-bg); background: color-mix(in srgb, var(--brand-bg) 10%, transparent); }
  .sheet-h h2 { font-size: 1.4rem; font-weight: 700; }
  .big { padding: 14px 22px; font-size: 1.05rem; border-radius: 980px; }
  .done h2 { font-size: 1.6rem; font-weight: 700; }
  .centre-msg { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); border-radius: 20px; }
  .centre-msg .eyebrow { color: var(--muted); }
  .centre-msg .eyebrow i { background: var(--brand-bg); }
  .centre-msg p { font-weight: 500; font-size: 1.05rem; }
  .centre-msg span.r { color: var(--brand); text-decoration: none; font-weight: 400; font-size: .95rem; }
  .bub { border-radius: 20px; }
  .bub.staff { background: var(--surface-2); color: var(--ink); border-bottom-left-radius: 6px; }
  .bub.worker { background: var(--brand-bg); color: #fff; border-bottom-right-radius: 6px; }
  .sendc { background: var(--brand-bg); }
  .onb { gap: 22px; padding-top: 26px; }
  .step h1, .welcome h1 { font-size: 2rem; font-weight: 700; font-stretch: normal; letter-spacing: -.03em; }
  .welcome .logo { color: var(--ink); font-size: 3rem; }
  .steps i { height: 4px; background: var(--surface-2); }
  .steps i::after { background: var(--brand-bg); }
  .cd { background: radial-gradient(circle at 50% 40%, #FF5147, var(--sos-deep) 75%); }
  .cd .btn { border-radius: 980px; font-weight: 600; }
  .ringwrap .n { font-family: var(--font-display); font-weight: 700; }
</style>

<div class="app">
  <header class="hdr">
    <span class="logo">TMWRC</span>
    <span class="grow"></span>
    <span class="netdot" id="net"><i></i><span></span></span>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="sw">SW</button><button type="button" data-lang="en">EN</button></div>
  </header>
  <div class="offbar" id="offbar" hidden><span data-i18n="offBanner"></span><button type="button" data-go="sms" data-i18n="smsNav"></button></div>

  <!-- ONBOARDING -->
  <section id="authView" hidden></section>

  <section id="onb" class="onb" hidden>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
    <form id="regForm" novalidate>
      <div class="step" data-step="1">
        <div class="welcome"><span class="logo">TMWRC</span><h1 data-i18n="s1Title"></h1><p class="muted" data-i18n="regIntro"></p></div>
        <label><span data-i18n="fullName"></span><input id="f_name" name="full_name" autocomplete="name" required></label>
        <label><span data-i18n="phoneAbroad"></span><input id="f_phone" name="phone" type="tel" inputmode="tel" placeholder="+968 ..." required></label>
        <label><span data-i18n="phoneHome"></span><input id="f_phone_tz" name="phone_tz" type="tel" inputmode="tel" placeholder="+255 ..."></label>
        <label><span data-i18n="passport"></span><input id="f_passport" name="passport_no" autocapitalize="characters"></label>
      </div>
      <div class="step" data-step="2" hidden>
        <h1 data-i18n="s2Title"></h1>
        <button type="button" class="btn primary big" id="detectBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg><span data-i18n="detect"></span></button>
        <p id="detectMsg" class="small muted" hidden></p>
        <div class="grid2">
          <label><span data-i18n="country"></span><select id="f_country" name="country" required></select></label>
          <label><span data-i18n="city"></span><input id="f_city" name="city" required></label>

  $("#refreshLoc").addEventListener("click", () => refreshLocation().catch(locError));
  $("#copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText($("#smsText").value).then(() => toast(t("copied"))).catch(() => { const a = $("#smsText"); a.focus(); a.select(); });
  });

  /* ---------------- language & network ---------------- */
  $$("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; ls.set("tucta_lang", lang); applyLang(); if (!$("#authView").hidden) showAuth(); }));
  window.addEventListener("online", () => { renderNet(); flush().then(pollFeed); });
  window.addEventListener("storage", e => { if (e.key === "tucta_demo_events" || e.key === "tucta_demo_replies") pollFeed(); });
  setInterval(pollFeed, API.LIVE ? 20000 : 4000);
  window.addEventListener("offline", renderNet);
  setInterval(() => { renderLoc(); if (navigator.onLine && outbox.length) flush(); }, 30000);

  /* ---------------- start ---------------- */
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  /* ---------------- accounts: register / sign in with emailed code ---------------- */
  function hideAll() { VIEWS.forEach(x => $("#v-" + x).hidden = true); $("#nav").hidden = true; $("#onb").hidden = true; $("#offbar").hidden = true; }
  function showAuth() {
    hideAll(); const v = $("#authView"); v.hidden = false;
    AuthUI.mount(v, { brand: "TMWRC", subtitle: t("authSub"), texts: lang === "sw" ? AUTH_SW : {}, start: ls.get("tmwrc_has_account", false) ? "signin" : "register",
      onDone: async (user, info) => {
        // a different person on this phone: start clean
        if (ls.get("tmwrc_last_user", null) !== user.id) {
          profile = null; history = []; outbox = []; feed = { events: [], replies: [] };
          ["tucta_profile", "tucta_history", "tucta_outbox", "thc_feed", "thc_read_at", "tucta_last_auto"].forEach(k => ls.set(k, null));
          ls.set("tucta_history", []); ls.set("tucta_outbox", []);
        }
        account = { id: user.id, email: user.email }; workerId = user.id;
        ls.set("tmwrc_account", account); ls.set("tmwrc_last_user", user.id); ls.set("tmwrc_has_account", true);
        v.hidden = true; v.innerHTML = "";
        if (!profile) { try { profile = await API.loadProfile(user.id); if (profile) ls.set("tucta_profile", profile); } catch (e) { /* offline: fill in again */ } }
        if (profile) { applyLang(); enterApp(); return; }
        const f = $("#regForm").elements; if (info.name) f.full_name.value = info.name;
        applyLang(); startOnboarding();
      } });
  }
  function enterApp() {
    showApp(); flush().then(pollFeed);
    if (ls.get("tmwrc_profile_dirty", false)) API.saveProfile(workerId, profile).then(() => ls.set("tmwrc_profile_dirty", false)).catch(() => {});
    const lastAuto = ls.get("tucta_last_auto", 0);
    if (profile.consent && Date.now() - lastAuto > 6 * 3600 * 1000)
      refreshLocation().then(() => { ls.set("tucta_last_auto", Date.now()); return send("checkin", { message: "auto" }); }).catch(() => {});
  }
  $("#signOutBtn").addEventListener("click", async () => {
    if (outbox.length) { toast(t("signOutWait", { n: outbox.length })); return; }
    try { await API.auth.signOut(); } catch (e) {}
    account = null; workerId = null; ls.set("tmwrc_account", null);
    showAuth();
  });

  applyLang();
  (async () => {
    // Signed in on this phone before? Then open straight away, even with no internet.
    let user = null;
    try { user = await API.auth.user(); } catch (e) { user = null; }
    if (!user && account && !navigator.onLine) user = account;      // offline: trust this phone's last sign-in
    if (!user) { showAuth(); return; }
    account = { id: user.id, email: user.email }; workerId = user.id; ls.set("tmwrc_account", account);
    if (!profile) { try { profile = await API.loadProfile(user.id); if (profile) ls.set("tucta_profile", profile); } catch (e) {} }
    renderProfile();
    if (!profile) { startOnboarding(); return; }
    enterApp();
  })();
})();
</script>
