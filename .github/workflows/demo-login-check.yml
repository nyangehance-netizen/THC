name: Demo code check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm init -y > /dev/null && npm install --no-audit --no-fund @supabase/supabase-js@2.45.4
      - run: node tests/demo-login-check.mjs
